name: Generate messages
on:
  pull_request:
    branches:
      - develop
jobs:
  generate-messages:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-versions: [20.x]
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/checkout@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Generate messages
        run: npm run extract-i18n
