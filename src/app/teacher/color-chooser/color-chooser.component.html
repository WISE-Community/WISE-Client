<mat-chip-listbox>
  @for (colorOption of colorOptions; track colorOption) {
    <mat-chip-option
      class="color-choice"
      [value]="colorOption"
      [selected]="colorOption === color()"
      (selectionChange)="color.set($event.selected ? $event.source.value : '')"
      [style.background-color]="colorOption"
    >
      <div class="color-option-div"></div>
    </mat-chip-option>
  }
</mat-chip-listbox>
