<mat-card class="standalone__content standalone__content--sm mat-elevation-z4">
  <mat-card-content>
    <h2 class="standalone__title accent" i18n>Create Student Account</h2>
    <p>
      <mat-form-field appearance="fill" class="w-full">
        <mat-label i18n>First Name</mat-label>
        <input matInput id="firstName" name="firstName" [(ngModel)]="firstName" autofocus />
      </mat-form-field>
    </p>
    <p>
      <mat-form-field appearance="fill" class="w-full">
        <mat-label i18n>Last Name</mat-label>
        <input matInput id="lastName" name="lastName" [(ngModel)]="lastName" autofocus />
      </mat-form-field>
    </p>
    <p>
      <button class="w-full" mat-flat-button color="primary" (click)="signUp()">
        <ng-container i18n>Sign Up</ng-container>
      </button>
    </p>
    @if (googleAuthenticationEnabled || microsoftAuthenticationEnabled) {
      <p class="center mat-headline-6">- or -</p>
      <p class="center">
        @if (googleAuthenticationEnabled) {
          <google-sign-in-button (signedIn)="googleSignIn($event)" text="signup_with" />
        }
      </p>
      <p class="center">
        @if (microsoftAuthenticationEnabled) {
          <button
            class="button--social-login button--microsoft"
            color="accent"
            mat-flat-button
            (click)="microsoftSignIn()"
          >
            <img src="assets/img/icons/ms-logo.svg" alt="Microsoft logo" />
            <ng-container i18n>Sign up with Microsoft</ng-container>
          </button>
        }
      </p>
    }
  </mat-card-content>
</mat-card>
