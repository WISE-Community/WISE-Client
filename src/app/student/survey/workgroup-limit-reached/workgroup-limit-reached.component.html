<div class="standalone mat-app-background">
  <div class="standalone__logo">
    <a routerLink="/">
      <picture>
        <source
          type="image/webp"
          srcset="assets/img/wise-web-logo-full.webp, assets/img/wise-web-logo-full@2x.webp 2x"
        />
        <source
          srcset="assets/img/wise-web-logo-full.png, assets/img/wise-web-logo-full@2x.png 2x"
        />
        <img src="assets/img/wise-web-logo-full.png" i18n-alt alt="WISE logo" />
      </picture>
    </a>
  </div>
  <mat-card class="standalone__content standalone__content--sm mat-elevation-z4 !m-auto">
    <mat-card-content>
      <p i18n>Sorry, this unit has reached the maximum number of submissions.</p>
    </mat-card-content>
  </mat-card>
</div>
