<div class="feedback-rules notice-bg-bg">
  <h5 class="flex flex-row justify-start items-center gap-1">
    <span i18n>Prompt Rules</span>
    <button
      mat-icon-button
      color="primary"
      matTooltip="Add a new rule"
      i18n-matTooltip
      matTooltipPosition="above"
      (click)="addNewRule(0)"
    >
      <mat-icon>add_circle</mat-icon>
    </button>
    <span class="flex grow"></span>
    <button mat-button (click)="showHelp()" i18n>Help</button>
  </h5>
  <ul
    cdkDropList
    [cdkDropListData]="feedbackRules"
    (cdkDropListDropped)="drop($event)"
    cdkScrollable
  >
    @for (
      rule of feedbackRules;
      track rule;
      let ruleIndex = $index;
      let first = $first;
      let last = $last
    ) {
      <li cdkDrag>
        <mat-card appearance="outlined" class="rule">
          <span class="flex flex-row flex-wrap gap-2">
            <span class="text-secondary flex flex-col justify-start items-center gap-5">
              <span class="mat-subtitle-1">{{ ruleIndex + 1 }}</span>
              <mat-icon cdkDragHandle title="Drag to reorder" i18n-title>drag_indicator</mat-icon>
            </span>
            <span class="flex flex-col justify-center items-start gap-2 grow">
              <mat-form-field class="rule-input form-field-no-hint" appearance="fill">
                <mat-label i18n>Expression</mat-label>
                <input
                  matInput
                  [(ngModel)]="rule.expression"
                  (ngModelChange)="inputChanged.next($event)"
                />
              </mat-form-field>
              <translatable-textarea
                [content]="rule"
                key="prompt"
                label="Prompt"
                i18n-label
                (defaultLanguageTextChanged)="inputChanged.next($event)"
                class="rule-input"
              />
            </span>
            <span class="flex flex-col justify-start items-center">
              <button
                mat-icon-button
                i18n-matTooltip
                matTooltip="Delete rule"
                matTooltipPosition="before"
                (click)="deleteRule(ruleIndex)"
              >
                <mat-icon>clear</mat-icon>
              </button>
              @if (feedbackRules.length > 1) {
                <button
                  [disabled]="first"
                  mat-icon-button
                  i18n-matTooltip
                  matTooltip="Move up"
                  matTooltipPosition="before"
                  (click)="moveUp(ruleIndex)"
                >
                  <mat-icon>arrow_upward</mat-icon>
                </button>
              }
              <button
                [disabled]="last"
                mat-icon-button
                i18n-matTooltip
                matTooltip="Move down"
                matTooltipPosition="before"
                (click)="moveDown(ruleIndex)"
              >
                <mat-icon>arrow_downward</mat-icon>
              </button>
            </span>
          </span>
        </mat-card>
      </li>
    }
  </ul>
  @if (feedbackRules.length > 0) {
    <button
      mat-icon-button
      color="primary"
      matTooltip="Add a new rule at the end"
      i18n-matTooltip
      matTooltipPosition="above"
      (click)="addNewRule(feedbackRules.length)"
    >
      <mat-icon>add_circle</mat-icon>
    </button>
  }
</div>
