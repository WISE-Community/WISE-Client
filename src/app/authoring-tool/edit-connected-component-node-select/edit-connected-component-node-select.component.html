<mat-form-field>
  <mat-label i18n>Step</mat-label>
  <mat-select
    [(ngModel)]="connectedComponent.nodeId"
    (ngModelChange)="connectedComponentNodeIdChanged()"
  >
    @for (nodeId of nodeIds; track nodeId) {
      @if (isApplicationNode(nodeId)) {
        <mat-option [value]="nodeId">
          {{ getNodePositionAndTitle(nodeId) }}
        </mat-option>
      }
    }
  </mat-select>
</mat-form-field>
