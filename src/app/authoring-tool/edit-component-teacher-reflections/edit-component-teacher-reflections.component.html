<mat-expansion-panel class="w-full mt-4">
  <mat-expansion-panel-header>
    <mat-panel-title i18n>Teacher Reflection Questions</mat-panel-title>
  </mat-expansion-panel-header>
  <div class="flex flex-col gap-4 py-2">
    <div class="flex flex-col gap-2">
      <div class="flex items-center justify-between">
        <label class="font-medium text-sm" i18n>Reflection Questions for Teachers</label>
        <button
          mat-button
          color="primary"
          type="button"
          (click)="addReflectionQuestion()"
          class="flex items-center gap-1"
        >
          <mat-icon>add</mat-icon>
          <span i18n>Add Question</span>
        </button>
      </div>

      @for (q of componentContent?.teacher?.reflectionQuestions; track q.id; let idx = $index) {
        <div class="flex items-center gap-2">
          <mat-form-field appearance="outline" class="flex-grow">
            <mat-label i18n>Question {{ idx + 1 }}</mat-label>
            <input
              matInput
              [(ngModel)]="q.text"
              (ngModelChange)="onQuestionTextChanged()"
              placeholder="e.g. Why did you choose these posts?"
              i18n-placeholder
            />
          </mat-form-field>
          <button
            mat-icon-button
            color="warn"
            type="button"
            (click)="deleteReflectionQuestion(idx)"
            matTooltip="Delete question"
            i18n-matTooltip
          >
            <mat-icon>delete</mat-icon>
          </button>
        </div>
      }
    </div>
  </div>
</mat-expansion-panel>
