@if (mode !== 'classroomMonitor') {
  <mat-card
    class="notebook-report flex flex-col"
    [ngClass]="{ collapsed: collapsed, full: full && !collapsed }"
  >
    <mat-card-header
      class="dark-theme mat-app-background !flex justify-start items-center"
      (click)="toggleCollapse()"
    >
      <mat-card-title class="mat-body-2 overflow--ellipsis !flex justify-start items-center gap-1">
        <mat-icon> assignment </mat-icon>
        <span>
          {{ reportItem.content.title }}
        </span>
      </mat-card-title>
      <span class="flex-grow"></span>
      <button
        mat-icon-button
        class="hidden sm:!inline-block"
        i18n-title
        title="Toggle Full Screen"
        (click)="$event.stopPropagation(); fullscreen()"
      >
        @if (!full || collapsed) {
          <mat-icon> fullscreen </mat-icon>
        }
        @if (full && !collapsed) {
          <mat-icon> fullscreen_exit </mat-icon>
        }
      </button>
      @if (!collapsed) {
        <button
          mat-icon-button
          i18n-title
          title="Collapse"
          (click)="$event.stopPropagation(); toggleCollapse()"
        >
          <mat-icon> arrow_drop_down </mat-icon>
        </button>
      } @else {
        <button
          mat-icon-button
          i18n-title
          title="Restore"
          (click)="$event.stopPropagation(); toggleCollapse()"
        >
          <mat-icon> arrow_drop_up </mat-icon>
        </button>
      }
    </mat-card-header>
    <mat-card-content [class.hidden]="collapsed" class="flex-grow">
      <wise-tinymce-editor
        [(model)]="reportItemContent"
        (modelChange)="changed(reportItemContent)"
        [isAddNoteButtonAvailable]="isAddNoteButtonAvailable"
        (openNotebook)="addNotebookItemContent($event)"
      />
    </mat-card-content>
    <mat-card-actions [class.hidden]="collapsed">
      <div class="actions flex justify-start items-center gap-2">
        <button
          mat-flat-button
          color="primary"
          [disabled]="!dirty"
          (click)="saveNotebookReportItem()"
          i18n
        >
          Save
        </button>
        @if (saveTime) {
          <save-time-message [saveTime]="saveTime" />
        }
        <div id="{{ reportId }}-toolbar"></div>
        <span class="flex-grow"></span>
        @if (reportItem.content.prompt) {
          <mat-icon
            class="info"
            tabindex="0"
            matTooltip="{{ reportItem.content.title }}: {{ reportItem.content.prompt }}"
            matTooltipPosition="above"
            >info</mat-icon
          >
        }
      </div>
    </mat-card-actions>
  </mat-card>
} @else {
  <div>
    @if (hasReport) {
      <article>
        <div [innerHTML]="reportItemContent"></div>
      </article>
    } @else {
      <p i18n>Team hasn't worked on {{ config.itemTypes.report.notes[0].title }} yet.</p>
    }
  </div>
}
