<div class="library library-teacher notice-bg-bg">
  <div class="content-block filters dark-theme library__header library-teacher__header primary-bg">
    <app-library-filters [filterValues]="filterValues" />
  </div>
  <div class="library__content library-teacher__content">
    <nav mat-tab-nav-bar i18n-aria-label aria-label="Teacher unit library navigation">
      <a
        mat-tab-link
        *ngFor="let tab of tabs; index as i"
        [routerLink]="[tab.path]"
        routerLinkActive
        #rla="routerLinkActive"
        [active]="rla.isActive"
      >
        {{ tab.label }} ({{ tab.numVisible }})
      </a>
    </nav>
    <app-official-library [filterValues]="filterValues" [hidden]="!isOfficialRoute()" />
    <app-community-library [filterValues]="filterValues" [hidden]="!isCommunityRoute()" />
    <app-personal-library [filterValues]="filterValues" [hidden]="!isPersonalRoute()" />
  </div>
</div>
