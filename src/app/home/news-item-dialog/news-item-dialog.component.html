<div class="dialog-header">
  <h1 mat-dialog-title>{{ newsItem.title }}</h1>
  <button mat-icon-button mat-dialog-close class="close-button">
    <mat-icon>close</mat-icon>
  </button>
</div>
@if (newsItem.news) {
  <mat-divider />
  <mat-dialog-content>
    <p>{{ newsItem.news }}</p>
  </mat-dialog-content>
}
