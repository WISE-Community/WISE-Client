<h2 class="standalone__title accent" i18n>Student Forgot Username or Password</h2>
<div class="standalone__content forgot flex flex-col items-center justify-center sm:flex-row">
  <app-call-to-action
    class="flex-1 w-full"
    icon="account_circle"
    iconColor="accent"
    i18n-headline
    headline="Username"
    i18n-content
    content="Look up username"
    destination="username"
  />
  <app-call-to-action
    class="flex-1 w-full"
    icon="lock"
    iconColor="accent"
    i18n-headline
    headline="Password"
    i18n-content
    content="Reset password"
    destination="password"
  />
</div>
