<mat-card class="standalone__content mat-elevation-z4 center">
  <mat-card-content>
    <form role="form" (submit)="submit()" [formGroup]="forgotTeacherUsernameFormGroup">
      <h2 class="standalone__title accent" i18n>Forgot Teacher Username</h2>
      @if (message) {
        <p class="warn">{{ message }}</p>
      }
      <p>
        <mat-form-field appearance="fill" class="w-full">
          <mat-label i18n>Email</mat-label>
          <input matInput id="email" name="email" formControlName="email" autofocus required />
          @if (forgotTeacherUsernameFormGroup.controls['email'].hasError('required')) {
            <mat-error i18n>Email required</mat-error>
          }
        </mat-form-field>
      </p>
      <button
        mat-flat-button
        color="primary"
        [disabled]="!forgotTeacherUsernameFormGroup.valid || processing"
        type="submit"
        class="button--progress w-full"
      >
        @if (processing) {
          <mat-progress-bar mode="indeterminate"></mat-progress-bar>
        }
        <span i18n>Submit</span>
      </button>
    </form>
  </mat-card-content>
  <mat-divider></mat-divider>
  <mat-card-content class="center">
    <p>
      <a routerLink="/contact" i18n>Contact WISE</a>
    </p>
    <p>
      <a routerLink="/join" i18n>Create New Account</a>
    </p>
  </mat-card-content>
</mat-card>
