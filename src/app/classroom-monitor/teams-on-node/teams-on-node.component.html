@if (workgroupsOnNode.length > 0) {

    class="flex items-center p-1 rounded-md notice-bg-bg"
    tabindex="0"
    matTooltip="{{ tooltipText }}"
    matTooltipPosition="above"
    matTooltipClass="multiline-tooltip"

    {{ workgroupsOnNode.length }}
  </div>
}
