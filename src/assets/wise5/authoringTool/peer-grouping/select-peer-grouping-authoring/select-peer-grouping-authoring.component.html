<div class="bottom-spacing flex flex-row justify-start items-center gap-2">
  <mat-label class="bold" i18n>Grouping Logic:</mat-label>
  @if (peerGrouping == null) {
    <span i18n>(None Selected)</span>
  } @else {
    <span>{{ peerGrouping.name }}</span>
  }
  <button
    mat-raised-button
    color="primary"
    (click)="selectGroupingLogic()"
    matTooltip="Select Grouping Logic"
    matTooltipPosition="above"
    i18n-matTooltip
    i18n
  >
    Select
  </button>
</div>
