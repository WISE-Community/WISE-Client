<div
  id="{{ step.id }}"
  class="step flex justify-start items-center gap-2 grow"
  [ngClass]="{ 'branch-path-step': isNodeInAnyBranchPath(step.id) }"
  [ngStyle]="{ 'background-color': getStepBackgroundColor(step.id) }"
  (click)="setCurrentNode(step.id)"
  (keyup.enter)="setCurrentNode(step.id)"
  role="button"
  tabindex="0"
  cdkDrag
  [cdkDragDisabled]="isBranchPoint"
  [cdkDragData]="{ type: 'step', id: step.id }"
  aria-label="Edit step"
  i18n-aria-label
>
  @if (batchEditMode) {
    <mat-checkbox
      color="primary"
      (change)="selectNode($event.checked)"
      (click)="$event.stopPropagation()"
      [disabled]="nodeTypeSelected() === 'lesson'"
      aria-label="Select step"
      i18n-aria-label
    />
  } @else if (!isBranchPoint) {
    <div class="drag-placeholder flex grow" *cdkDragPlaceholder></div>
    <mat-icon cdkDragHandle(click)="$event.stopPropagation()" title="Drag to reorder" i18n-title
      >drag_indicator</mat-icon
    >
  }
  <strong>
    <node-icon-and-title [nodeId]="step.id" [showPosition]="showPosition" />
    (ID: {{ step.id }})
  </strong>
  <div class="flex justify-start items-center gap-2">
    @if (isBranchPoint) {
      <button
        mat-icon-button
        (click)="goToEditBranch(step.id); $event.stopPropagation()"
        matTooltip="Edit branch point: {{ getNumberOfBranchPaths(step.id) }} paths based on {{
          getBranchCriteriaDescription(step.id)
        }}"
        matTooltipPosition="right"
        i18n-matTooltip
      >
        <mat-icon class="flip-vertical">call_split</mat-icon>
      </button>
    }
    @if (nodeHasConstraint(step.id)) {
      <button
        mat-icon-button
        (click)="constraintIconClicked(step.id); $event.stopPropagation()"
        matTooltip="{{ getNumberOfConstraintsOnNode(step.id) }} Constraint(s) {{
          getConstraintDescriptions(step.id)
        }}"
        matTooltipPosition="right"
        i18n-matTooltip
      >
        <mat-icon>block</mat-icon>
      </button>
    }
    @if (nodeHasRubric(step.id)) {
      <mat-icon
        tabindex="0"
        matTooltip="Has rubric/teaching tips"
        matTooltipPosition="above"
        i18n-matTooltip
        >message</mat-icon
      >
    }
  </div>
  <div
    class="tooltip-helper flex grow"
    matTooltip="Edit step"
    matTooltipPosition="above"
    i18n-matTooltip
  ></div>
  <!-- <div class="dynamic-step-buttons"> -->
  <div class="flex justify-start items-center">
    @if (!isBranchPoint) {
      <button
        class="step-action"
        mat-icon-button
        (click)="move(); $event.stopPropagation()"
        matTooltip="Move step"
        matTooltipPosition="above"
        i18n-matTooltip
      >
        <mat-icon>redo</mat-icon>
      </button>
    }
    <button
      class="step-action"
      mat-icon-button
      (click)="copy(); $event.stopPropagation()"
      matTooltip="Copy step"
      matTooltipPosition="above"
      i18n-matTooltip
    >
      <mat-icon>content_copy</mat-icon>
    </button>
    <button
      class="step-action"
      mat-icon-button
      (click)="delete(); $event.stopPropagation()"
      matTooltip="Delete step"
      matTooltipPosition="above"
      i18n-matTooltip
    >
      <mat-icon>delete</mat-icon>
    </button>
  </div>
  <!-- </div> -->
</div>
