@if (showTranslationInput()) {
  <mat-form-field class="translatable translatable-form-field">
    <mat-label>{{ label }} ({{ currentLanguage().language }})</mat-label>
    <input
      class="enable-in-translation"
      matInput
      [(ngModel)]="translationText"
      (ngModelChange)="translationTextChanged.next($event)"
      placeholder="{{ placeholder }}"
    />
    @if (hint) {
      <mat-hint>{{ hint }}</mat-hint>
    }
    <mat-hint class="translatable-input-hints">
      <div class="source-language selected-bg-bg">
        <strong><mat-icon>translate</mat-icon> {{ defaultLanguage.language }}:</strong>
        {{ content[key] }}
      </div>
      @if (content[key]) {
        <div class="source-language selected-bg-bg translation-suggestions">
          <span (click)="translateText()"><mat-icon>auto_awesome</mat-icon> Translate with AI</span>
        </div>
      }
    </mat-hint>
  </mat-form-field>
} @else {
  <mat-form-field class="translatable-form-field">
    <mat-label>{{ label }}</mat-label>
    <input
      matInput
      [(ngModel)]="content[key]"
      (ngModelChange)="defaultLanguageTextChanged.next($event)"
      placeholder="{{ placeholder }}"
    />
    @if (hint) {
      <mat-hint>{{ hint }}</mat-hint>
    }
  </mat-form-field>
}
