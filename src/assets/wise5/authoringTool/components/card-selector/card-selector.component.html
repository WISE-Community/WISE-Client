<div class="item-cards-container gray-lighter-bg flex flex-wrap">
  @for (item of items; track item.id) {
    <div>
      <mat-card
        appearance="outlined"
        class="item-card"
        [ngStyle]="isItemSelected(item) && { border: '4px solid #00C853' }"
      >
        <mat-card-title class="item-card-title">
          {{ item.title }}
        </mat-card-title>
        <div class="item-card-image" style="background-image: url('{{ item.thumbnail }}');"></div>
        <mat-card-actions class="item-card-actions flex justify-start items-center gap-2">
          @if (isItemSelected(item)) {
            <mat-icon class="success" aria-label="Selected" i18n-aria-label>
              check_circle
            </mat-icon>
          }
          <span class="item-card-actions-spacer"></span>
          <button mat-flat-button color="primary" (click)="previewItem(item)" i18n>Preview</button>
          <button
            mat-flat-button
            color="primary"
            (click)="selectItem(item)"
            target="_blank"
            [disabled]="isItemSelected(item)"
            i18n
          >
            Select
          </button>
        </mat-card-actions>
      </mat-card>
    </div>
  }
  @if (items.length < 1) {
    <div class="no-results-message-container flex justify-center items-start">
      <span i18n>No results found</span>
    </div>
  }
</div>
