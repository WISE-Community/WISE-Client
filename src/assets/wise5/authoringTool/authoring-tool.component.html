<link rel="stylesheet" href="/assets/wise5/themes/default/style/angular-material.css" />
<link rel="stylesheet" href="/assets/wise5/themes/default/style/author.css" />
<div id="top" class="app-styles authoring" disable-delete-keypress role="main">
  <mat-drawer-container>
    <mat-drawer #drawer [(opened)]="isMenuOpen" mode="over" class="mat-elevation-z4">
      <main-menu [title]="title" [views]="views" />
    </mat-drawer>
    <mat-drawer-content>
      <at-top-bar
        [logoPath]="logoPath"
        [projectId]="projectId"
        [runId]="runId"
        [runCode]="runCode"
      />
      @if (showToolbar) {
        <authoring-tool-bar (onMenuToggle)="toggleMenu()" />
      }
      <content
        id="content"
        class="l-main flex flex-col grow"
        [ngClass]="{ 'l-main--with-toolbar': showToolbar }"
        role="main"
        cdkScrollable
      >
        <router-outlet />
      </content>
      @if (showToolbar) {
        <side-menu [views]="views" />
      }
    </mat-drawer-content>
  </mat-drawer-container>
</div>
