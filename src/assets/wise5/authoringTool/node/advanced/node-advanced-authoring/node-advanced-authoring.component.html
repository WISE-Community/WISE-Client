<div class="main-div flex gap-5">
  <button
    class="enable-in-translation"
    mat-raised-button
    color="primary"
    routerLink=".."
    matTooltip="Back"
    matTooltipPosition="above"
    i18n-matTooltip
  >
    <mat-icon>arrow_back</mat-icon>
  </button>
  @if (!isGroupNode) {
    <button
      mat-raised-button
      color="primary"
      routerLink="general"
      matTooltip="General settings"
      matTooltipPosition="above"
      i18n-matTooltip
    >
      <mat-icon>settings</mat-icon>
    </button>
    <button
      class="enable-in-translation"
      mat-raised-button
      color="primary"
      routerLink="rubric"
      matTooltip="Edit step rubric"
      matTooltipPosition="above"
      i18n-matTooltip
    >
      <mat-icon>message</mat-icon>
    </button>
    <button
      mat-raised-button
      color="primary"
      routerLink="path"
      matTooltip="Edit transitions"
      matTooltipPosition="above"
      i18n-matTooltip
    >
      <mat-icon>trending_up</mat-icon>
    </button>
    <button
      mat-raised-button
      color="primary"
      routerLink="constraint"
      matTooltip="Edit constraints"
      matTooltipPosition="above"
      i18n-matTooltip
    >
      <mat-icon>block</mat-icon>
    </button>
  }
  <button
    mat-raised-button
    color="primary"
    routerLink="json"
    matTooltip="Show JSON"
    matTooltipPosition="above"
    i18n-matTooltip
  >
    <mat-icon>code</mat-icon>
  </button>
</div>
<router-outlet></router-outlet>
