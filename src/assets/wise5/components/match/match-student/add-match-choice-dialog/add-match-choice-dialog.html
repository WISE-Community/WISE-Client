<form role="form" [formGroup]="addChoiceFormGroup" (submit)="save()">
  <h2 mat-dialog-title i18n>Enter Item Text</h2>
  <mat-dialog-content>
    <mat-form-field style="width: 100%">
      <input matInput name="choiceText" formControlName="choiceText" (keydown.enter)="save()" />
      @if (addChoiceFormGroup.controls['choiceText'].hasError('required')) {
      <mat-error i18n>Item Text required</mat-error>
      }
    </mat-form-field>
  </mat-dialog-content>
  <mat-dialog-actions align="end">
    <button mat-button type="button" (click)="closeDialog()" i18n>Cancel</button>
    <button
      mat-flat-button
      color="primary"
      type="submit"
      [disabled]="!addChoiceFormGroup.valid"
      i18n
    >
      OK
    </button>
  </mat-dialog-actions>
</form>
