<div class="mat-small secondary-text flex flex-wrap justify-start items-center gap-2">
  <span i18n>Chat members:</span>
  @for (info of peerChatWorkgroupInfos; track info) {
    <span>
      <mat-icon class="mat-24" [ngStyle]="{ color: info.avatarColor }"> account_circle </mat-icon>
      <span class="names">{{ info.displayNames }}</span>
    </span>
  }
</div>
