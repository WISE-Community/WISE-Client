<div class="flex justify-start items-start gap-1">
  <img
    [src]="computerAvatarImageSrc"
    class="computer-avatar"
    aria-label="Automated guidance response"
    i18n-aria-label
  />
  <div class="flex justify-start flex-grow">
    <div class="response-text notice-bg-bg">
      <div class="mat-small secondary-text poster" i18n>{{ computerAvatar.name }}</div>
      <markdown [data]="message.content"></markdown>
    </div>
  </div>
</div>
