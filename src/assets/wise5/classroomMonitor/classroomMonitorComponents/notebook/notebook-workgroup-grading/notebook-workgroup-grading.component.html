<div class="md-whiteframe-1dp notebook-workgroup-grading">
  <div class="list-item">
    <button
      mat-button
      (click)="toggleExpand()"
      class="list-item__subheader-button row-button"
      aria-label="Show/hide team's notebook contents"
      i18n-aria-label
    >
      <div fxLayout="row" fxFlex>
        <div fxLayout="row" fxLayoutAlign="center center" fxFlex="15">
          {{ workgroup.workgroupId }}
        </div>
        <div fxLayout="row" fxLayoutAlign="start center" fxFlex>
          {{ workgroup.displayNames }}
        </div>
        @if (notesEnabled) {
          <div class="mat-headline-6" fxLayout="row" fxLayoutAlign="center center" fxFlex="15">
            <span [ngClass]="{ 'text-secondary': getNumActiveNotes() === 0 }">
              {{ getNumActiveNotes() }}
            </span>
          </div>
        }
        @if (reportEnabled) {
          <div fxLayout="row" fxLayoutAlign="center center" fxFlex="25">
            @if (reportHasWork) {
              <span class="success center" i18n>
                Latest Work: {{ workgroup.report.serverSaveTime | date: 'mediumDate' }}
              </span>
            }
            @if (!reportHasWork) {
              <span class="text-secondary" i18n> No Work </span>
            }
          </div>
        }
      </div>
    </button>
  </div>
  @if (expand) {
    <mat-list-item class="grading__item-container">
      <mat-tab-group class="mat-subtitle-2 app-bg-bg" fxFlex>
        @if (notesEnabled) {
          <mat-tab label="Notes" i18n-label>
            <notebook-notes
              [mode]="'classroomMonitor'"
              [config]="notebookConfig"
              [viewOnly]="true"
              [workgroupId]="workgroup.workgroupId"
            />
          </mat-tab>
        }
        @if (reportEnabled) {
          <mat-tab label="{{ reportTitle }}">
            <notebook-report
              class="report-grading"
              [mode]="'classroomMonitor'"
              [config]="notebookConfig"
              [workgroupId]="workgroup.workgroupId"
            />
          </mat-tab>
        }
      </mat-tab-group>
    </mat-list-item>
  }
</div>
