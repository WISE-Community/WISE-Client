<div class="flex flex-wrap justify-start items-stretch">
  @for (grouping of groupings; track grouping) {
    <div class="group-container w-full md:w-1/2 lg:w-1/3">
      <mat-card class="group notice-bg-bg">
        <peer-group-grouping [grouping]="grouping" (moveWorkgroup)="emitMoveWorkgroup($event)" />
      </mat-card>
    </div>
  }
</div>
