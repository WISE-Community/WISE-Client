<div class="flex justify-start items-center gap-2">
  <mat-icon class="md-36" style="color: {{ avatarColor }};"> account_circle </mat-icon>
  <div class="heavy">
    {{ usernames }}
    <span class="md-caption text-secondary more" i18n>(Team {{ workgroupId }})</span>
  </div>
  @if (hasAlert) {
    <status-icon [tooltip]="alertLabel" [name]="alertIconName" [class]="alertIconClass" />
  }
  @if (hasNewWork) {
    <span class="badge badge--info animate-fade" i18n>New</span>
  }
</div>
