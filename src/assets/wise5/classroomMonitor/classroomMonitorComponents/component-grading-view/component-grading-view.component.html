<div class="mat-elevation-z1 app-background flex flex-col p-3 gap-3">
  <div class="notice text-start flex justify-between gap-4">
    <div>
      <div i18n>Prompt</div>
      <div class="mat-body-1" [innerHTML]="component.prompt"></div>
    </div>
    @if (hasStudentWork) {
      <div class="flex-shrink-0 pt-1.5">
        <component-completion [node]="node" [component]="component" [periodId]="periodId" />
      </div>
    }
  </div>
  <div class="flex gap-2 -mx-1">
    <milestone-report-button [node]="node" [component]="component" [periodId]="periodId" />
    <peer-group-button [node]="node" [component]="component" />
  </div>
  @if (hasSummaryData) {
    <div class="flex flex-col sm:flex-row gap-3 m-3">
      @if (component?.type === 'MultipleChoice' && hasStudentWork) {
        <teacher-summary-display
          [nodeId]="node.id"
          [componentId]="component.id"
          [periodId]="periodId"
          [studentDataType]="'responses'"
          [source]="source"
          [highlightCorrectAnswer]="hasCorrectAnswer"
          [chartType]="component.choiceType === 'multiple' ? 'columnn' : 'pie'"
          [doRender]="true"
          class="w-full sm:w-1/2"
        />
      }
      @if (hasScoresSummary && hasScoreAnnotation) {
        <teacher-summary-display
          [nodeId]="node.id"
          [componentId]="component.id"
          [periodId]="periodId"
          [studentDataType]="'scores'"
          [source]="source"
          [chartType]="'column'"
          [doRender]="true"
          class="w-full sm:w-1/2"
        />
      }
    </div>
  }
</div>
