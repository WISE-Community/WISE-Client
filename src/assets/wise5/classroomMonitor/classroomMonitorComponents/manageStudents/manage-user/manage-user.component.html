<div class="manage-user flex justify-start items-center gap-1">
  <show-student-info [user]="user" />
  <span class="flex-grow"></span>
  <button
    class="userInfoLink"
    mat-icon-button
    matTooltip="View student info"
    i18n-matTooltip
    matTooltipPosition="above"
    (click)="viewUserInfo($event)"
  >
    <mat-icon class="text-secondary">info</mat-icon>
  </button>
  @if (user.isGoogleUser) {
    <button
      class="googleUserButton"
      mat-icon-button
      matTooltip="Student signs in with Google"
      i18n-matTooltip
      matTooltipPosition="above"
    >
      <mat-icon svgIcon="google"></mat-icon>
    </button>
  } @else {
    <button
      class="userInfoLink"
      mat-icon-button
      matTooltip="Change student password"
      i18n-matTooltip
      matTooltipPosition="above"
      (click)="changePassword($event)"
    >
      <mat-icon class="text-secondary">vpn_key</mat-icon>
    </button>
  }
  <button
    class="userInfoLink"
    mat-icon-button
    matTooltip="Remove student"
    i18n-matTooltip
    matTooltipPosition="above"
    aria-label="Remove student"
    i18n-aria-label
    (click)="removeUser($event)"
  >
    <mat-icon class="text-secondary">clear</mat-icon>
  </button>
</div>
