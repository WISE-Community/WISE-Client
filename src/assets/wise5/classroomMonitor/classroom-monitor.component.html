<link rel="stylesheet" href="/assets/wise5/themes/default/style/angular-material.css" />
<link rel="stylesheet" href="/assets/wise5/themes/default/style/monitor.css" />
<div class="app-styles monitor-theme monitor" disable-delete-keypress role="main">
  <mat-sidenav-container>
    <mat-sidenav #drawer [(opened)]="menuOpen" mode="over" class="mat-elevation-z4">
      <main-menu title="Classroom Monitor" i18n-title [views]="views" />
    </mat-sidenav>
    <mat-sidenav-content>
      <top-bar
        [logoPath]="logoPath"
        [notifications]="notifications"
        [projectId]="projectId"
        [projectTitle]="projectTitle"
        [runId]="runId"
        [runCode]="runCode"
      />
      <tool-bar [workgroupId]="workgroupId" (onMenuToggle)="toggleMenu()" />
      <main id="content" class="l-main flex flex-col flex-grow">
        <router-outlet />
      </main>
      <side-menu [views]="views" />
      @if (reportEnabled) {
        <notebook-report
          [ngClass]="{ 'report-full': reportFullscreen }"
          [notebookConfig]="notebookConfig"
        />
      }
    </mat-sidenav-content>
  </mat-sidenav-container>
</div>
