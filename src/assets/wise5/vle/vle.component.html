<link rel="stylesheet" href="/assets/wise5/themes/default/style/angular-material.css" />
<link rel="stylesheet" href="/assets/wise5/themes/default/style/vle.css" />
<link rel="stylesheet" [href]="projectStylePath | safeUrl" />
@if (initialized) {
  <mat-drawer-container [hasBackdrop]="false">
    @if (chatbotEnabled) {
      <mat-drawer
        [mode]="mdScreen ? 'over' : 'side'"
        position="end"
        (keydown.escape)="chatbotVisible = false"
        [(opened)]="chatbotVisible"
        class="sidebar"
        [ngClass]="{ 'sidebar-tabbed': projectService.project.theme === 'tab' }"
      >
        <chatbot [config]="chatbotConfig" (closeChatbot)="chatbotVisible = false" />
      </mat-drawer>
    }
    <mat-drawer-content>
      <top-bar [projectName]="project.metadata.title" />
      <ng-container *ngTemplateOutlet="vleTemplate"></ng-container>
      @if (reportEnabled) {
        <notebook-report
          [ngClass]="{
            'notes-visible': notesVisible || chatbotVisible,
            'report-full': reportFullscreen
          }"
          [config]="notebookConfig"
        />
      }
    </mat-drawer-content>
  </mat-drawer-container>
}

<div id="wise-link-communicator" class="wise-link-communicator"></div>

<ng-template #defaultVLETemplate>
  <step-tools
    class="control-bg-bg mat-elevation-z1"
    [notebookConfig]="notebookConfig"
    [chatbotEnabled]="chatbotEnabled"
    (toggleChatbot)="chatbotVisible = !chatbotVisible"
  />
  <div
    id="content"
    class="vle-content mat-app-background node-view"
    [ngClass]="{
      'pb-10': reportEnabled
    }"
  >
    @if (runEndedAndLocked) {
      <run-ended-and-locked-message class="notice" />
    }
    <node class="top" [node]="currentNode" />
    <node-navigation class="l-constrained px-2 min-[640px]:px-6 xl:px-2 mb-12" />
  </div>
</ng-template>

<ng-template #tabbedVLETemplate>
  <group-tabs
    [notebookConfig]="notebookConfig"
    [chatbotEnabled]="chatbotEnabled"
    (toggleChatbot)="chatbotVisible = !chatbotVisible"
    class="app-bg-bg mat-elevation-z1"
  />
  <div id="content" class="vle-content tabbed node-view">
    <div class="tab-content">
      @if (runEndedAndLocked) {
        <run-ended-and-locked-message />
      }
      <node class="node-tabbed top" [node]="currentNode" />
      <div class="node-nav">
        <node-navigation class="l-constrained" [showPrevNodeNav]="true" />
      </div>
    </div>
  </div>
</ng-template>
