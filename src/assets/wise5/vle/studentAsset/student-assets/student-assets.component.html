@if (studentAssets.length > 0) {
  <div class="studentAssets flex flex-wrap">
    @for (studentAsset of studentAssets; track studentAsset) {
      <img
        (click)="attachStudentAssetToComponent($event, studentAsset)"
        [src]="studentAsset.iconURL"
        class="studentAsset"
        title="Use this file"
        i18n-title
      />
    }
  </div>
}
@if (mode === 'preview') {
  <div i18n>The student assets will appear here once you set up a classroom run.</div>
} @else {
  <div class="drop-box" (fileDropped)="uploadStudentAssets($event)" dragAndDrop>
    <input
      type="file"
      (change)="uploadStudentAssets($event.target.files)"
      #fileDropRef
      multiple
      class="file-input"
    />
    <div i18n>Drop image or file here or click to upload!</div>
  </div>
}
