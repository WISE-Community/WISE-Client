<div class="component-header-header" [innerHTML]="header"></div>
<div class="component-header flex flex-wrap gap-1">
  <prompt
    [prompt]="component.content.prompt"
    [nodeId]="component.nodeId"
    [componentId]="component.id"
    [dynamicPrompt]="dynamicPrompt"
    (dynamicPromptChanged)="onDynamicPromptChanged($event)"
  />
  <possible-score [maxScore]="component.content.maxScore" />
</div>
