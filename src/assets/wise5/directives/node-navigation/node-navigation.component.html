<div class="flex gap-4">
  @if (hasPrevNode && showPrevNodeNav) {
    <button mat-raised-button color="primary" (click)="goToPrevNode()">
      <mat-icon>{{ prevIcon }}</mat-icon>
      <span i18n>Previous Step</span>
    </button>
  }
  @if (hasNextNode) {
    <button mat-raised-button color="primary" (click)="goToNextNode()">
      <mat-icon>{{ nextIcon }}</mat-icon>
      <span i18n>Next Step</span>
    </button>
  }
</div>
