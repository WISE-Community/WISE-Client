@if (isOrderedMatch) {
  <ordered-match-summary-display
    [nodeId]="nodeId"
    [componentId]="componentId"
    [periodId]="periodId"
    [isOrderedMatch]="true"
  />
} @else {
  <unordered-match-summary-display
    [nodeId]="nodeId"
    [componentId]="componentId"
    [periodId]="periodId"
    [isOrderedMatch]="false"
    [doRender]="true"
  />
}
