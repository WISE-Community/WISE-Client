<div class="flex flex-wrap gap-2 items-center mb-2">
  <h2 class="mat-subtitle-1 !m-0" i18n>AI Summary</h2>
  <span class="mat-caption" i18n>Summarize class responses using AI</span>
</div>
<div class="flex flex-wrap gap-2 items-center">
  <button
    mat-stroked-button
    (click)="generateSummary()"
    [disabled]="generatingSummary"
    color="primary"
  >
    <span i18n>Generate</span><mat-icon>auto_awesome</mat-icon>
  </button>
  @if (generatingSummary) {
    <mat-spinner diameter="20" />
  }
  @if (newSummaryAvailable) {
    <span class="info" i18n>*New responses since last summary</span>
  }
</div>
@if (summary) {
  <markdown [data]="summary" />
  <div class="mat-caption text-secondary mt-1">{{ summaryCaption }}</div>
}
