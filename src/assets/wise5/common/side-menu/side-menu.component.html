<div class="menu-sidebar">
  @for (view of views; track view.name) {
    @if (view.type === 'primary' && view.active) {
      <button
        mat-icon-button
        id="{{ view.route }}"
        (click)="goToView(view)"
        matTooltip="{{ view.name }}"
        matTooltipPosition="after"
      >
        <mat-icon>{{ view.icon }}</mat-icon>
      </button>
    }
  }
</div>
