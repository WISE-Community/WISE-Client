<mat-expansion-panel class="mb-4" [expanded]="true">
  <mat-expansion-panel-header>
    <mat-panel-title i18n>Teacher Reflection</mat-panel-title>
  </mat-expansion-panel-header>
  <div class="flex flex-col gap-4 py-2">
    <span i18n
      >Capture your thoughts as you reflect on this activity. Your answers won't be displayed to
      your students.</span
    >
    @for (q of questions(); track q.id) {
      <div class="flex flex-col gap-1">
        <label class="font-medium text-sm">{{ q.text }}</label>
        <mat-form-field appearance="outline" class="w-full">
          <textarea
            matInput
            rows="2"
            [ngModel]="getAnswerText(q.id)"
            (ngModelChange)="onAnswerChange(q, $event)"
            placeholder="Enter your reflection..."
            i18n-placeholder
          ></textarea>
        </mat-form-field>
      </div>
    }
  </div>
</mat-expansion-panel>
